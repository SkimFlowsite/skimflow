name: Bug report
description: Report a problem with the contracts, docs, or site
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security-sensitive** issues do not file here —
        follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: contracts / web / docs
    validations:
      required: false
